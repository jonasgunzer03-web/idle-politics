<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-Icon „Idle Politics“ (Spiel-Look): Himmel, Rednerpult mit aufsteigenden Balken,
       goldener Stern. Inhalt in der sicheren Zone (80 %) für maskierbare Icons. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa6ff"/>
      <stop offset="1" stop-color="#7fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="250" r="196" fill="#ffffff" fill-opacity="0.18"/>
  <!-- Wolken -->
  <ellipse cx="120" cy="150" rx="46" ry="22" fill="#ffffff" fill-opacity="0.9"/>
  <ellipse cx="150" cy="138" rx="34" ry="24" fill="#ffffff" fill-opacity="0.9"/>
  <ellipse cx="398" cy="196" rx="40" ry="18" fill="#ffffff" fill-opacity="0.9"/>
  <!-- aufsteigende Balken -->
  <rect x="150" y="226" width="50" height="86" rx="12" fill="#2fbf55"/>
  <rect x="150" y="300" width="50" height="12" fill="#23963f"/>
  <rect x="214" y="180" width="50" height="132" rx="12" fill="#ffc533"/>
  <rect x="214" y="300" width="50" height="12" fill="#d9961a"/>
  <rect x="278" y="128" width="50" height="184" rx="12" fill="#ff5466"/>
  <rect x="278" y="300" width="50" height="12" fill="#c22a3c"/>
  <!-- Stern -->
  <path d="M303 62 l13 26.4 29.1 4.2 -21 20.5 5 29 -26.1 -13.7 -26.1 13.7 5 -29 -21 -20.5 29.1 -4.2z" fill="#ffd23f" stroke="#d9961a" stroke-width="6" stroke-linejoin="round"/>
  <!-- Rednerpult -->
  <path d="M120 314 h272 a10 10 0 0 1 9 14 l-12 26 h-266 l-12 -26 a10 10 0 0 1 9 -14z" fill="#ffffff"/>
  <path d="M168 354 h176 l-14 88 a12 12 0 0 1 -12 10 h-124 a12 12 0 0 1 -12 -10z" fill="#ffffff"/>
  <path d="M168 354 h176 l-3 18 h-170z" fill="#d3e2f1"/>
  <circle cx="256" cy="404" r="26" fill="#ffc533" stroke="#d9961a" stroke-width="6"/>
</svg>
